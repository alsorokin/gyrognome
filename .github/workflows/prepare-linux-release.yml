name: Prepare private Linux candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Build and inspect native candidate
        run: |
          python3 scripts/prepare-release.py \
            --target "${{ matrix.target }}" \
            --version 1.0.0 \
            --revision "$GITHUB_SHA"
          cd target/release-candidates
          sha256sum -c "gyrognome-1.0.0-${{ matrix.target }}.tar.gz.sha256"
      - name: Retain private candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-candidate-${{ matrix.target }}
          path: target/release-candidates/gyrognome-1.0.0-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          retention-days: 7
