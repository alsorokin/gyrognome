[package]
name = "gyrognome"
version = "1.2.0"
edition = "2024"
description = "Linux-native console Progress Quest client"
repository = "https://github.com/alsorokin/gyrognome"
readme = "README.md"
license = "MIT"
publish = false
autobins = false
default-run = "gyro"

[features]
# Exposes a stdin/stdout-only adapter used exclusively by the Playwright
# conformance harness. It is intentionally absent from normal CLI builds.
conformance-bridge = []
desktop-live-conformance = []
enrollment-test-transport = []

[[bin]]
name = "gyro"
path = "src/main.rs"

[[bin]]
name = "gyrognome"
path = "src/bin/gyrognome.rs"

[[bin]]
name = "desktop-live-conformance"
path = "src/bin/desktop_live_conformance.rs"
required-features = ["desktop-live-conformance"]

[[bin]]
name = "pemptus-acceptance-probe"
path = "src/bin/pemptus_acceptance_probe.rs"
required-features = ["desktop-live-conformance"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0.0"
flate2 = "1.1"
fs2 = "0.4.3"
libc = "0.2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
signal-hook = "0.4.4"
thiserror = "2.0"
ureq = { version = "3.1.4", default-features = false, features = ["rustls"] }
url = "2.5"
uuid = { version = "1.26.1", features = ["v4"] }
