[package]
name = "gyrognome"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0.0"
fs2 = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
signal-hook = "0.4.4"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.26.1", features = ["v4"] }
